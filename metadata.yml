Identifier: eos3xhm
Slug: hades-oral-druglikeness
Status: Ready
Title: HADES Oral Drug-Likeness
Description: Scores how closely a compound resembles an approved oral drug, with
  0.63 the authors recommended cutoff. HADES averages probabilities from five 
  tree and boosting classifiers over 298 features combining Mordred descriptors,
  ADMET-AI predictions and QED terms, trained on 1,177 approved oral drugs 
  against 5,307 nondrugs from ChEMBL, ZINC and GDB. Scores rise across clinical 
  phases and fall for orally toxic, small-ring and chemically implausible 
  structures. This model is based on a random-split provided by the authors.
